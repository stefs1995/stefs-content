<style>
/* Layout: satu layar penuh. Header + tab kolom berwarna di atas, papan kanban geser horizontal, tombol tambah mengambang. */
:root {
  --bg: #f2f3f7; --surface: #ffffff; --surface2: #e8eaf1; --fg: #16181f; --muted: #5a6172; --line: #d8dbe5;
  --ink: #16181f; --ink-fg: #ffffff; --danger: #c62a47;
  --inspo-x: #7c5cff; --inspo-b: #ece8ff; --inspo-t: #4a2fc4;
  --ideas-x: #e69a00; --ideas-b: #fff1cf; --ideas-t: #7a4f00;
  --ongoing-x: #2f7de1; --ongoing-b: #dcebff; --ongoing-t: #124f9e;
  --schedule-x: #0f9d94; --schedule-b: #d3f3ef; --schedule-t: #075f59;
  --done-x: #3a9a3a; --done-b: #dff3dc; --done-t: #1f5f1f;
  --viral-x: #e5385f; --viral-b: #ffdde5; --viral-t: #a01634;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "DM Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1116; --surface: #191c24; --surface2: #232734; --fg: #eceef5; --muted: #9aa1b4; --line: #2c3140;
    --ink: #eceef5; --ink-fg: #0f1116; --danger: #ff7a8f;
    --inspo-x: #9d85ff; --inspo-b: #2a2447; --inspo-t: #c4b6ff;
    --ideas-x: #f5b535; --ideas-b: #3a2f10; --ideas-t: #ffd47a;
    --ongoing-x: #5a9cf0; --ongoing-b: #172b47; --ongoing-t: #9ec8ff;
    --schedule-x: #35c4b9; --schedule-b: #123533; --schedule-t: #7fe3da;
    --done-x: #5fbb5f; --done-b: #1c3320; --done-t: #a3e29e;
    --viral-x: #ff6b8a; --viral-b: #44202b; --viral-t: #ff9fb3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1116; --surface: #191c24; --surface2: #232734; --fg: #eceef5; --muted: #9aa1b4; --line: #2c3140;
  --ink: #eceef5; --ink-fg: #0f1116; --danger: #ff7a8f;
  --inspo-x: #9d85ff; --inspo-b: #2a2447; --inspo-t: #c4b6ff;
  --ideas-x: #f5b535; --ideas-b: #3a2f10; --ideas-t: #ffd47a;
  --ongoing-x: #5a9cf0; --ongoing-b: #172b47; --ongoing-t: #9ec8ff;
  --schedule-x: #35c4b9; --schedule-b: #123533; --schedule-t: #7fe3da;
  --done-x: #5fbb5f; --done-b: #1c3320; --done-t: #a3e29e;
  --viral-x: #ff6b8a; --viral-b: #44202b; --viral-t: #ff9fb3;
  color-scheme: dark;
}
[data-col="inspo"] { --x: var(--inspo-x); --xb: var(--inspo-b); --xt: var(--inspo-t); }
[data-col="ideas"] { --x: var(--ideas-x); --xb: var(--ideas-b); --xt: var(--ideas-t); }
[data-col="ongoing"] { --x: var(--ongoing-x); --xb: var(--ongoing-b); --xt: var(--ongoing-t); }
[data-col="schedule"] { --x: var(--schedule-x); --xb: var(--schedule-b); --xt: var(--schedule-t); }
[data-col="done"] { --x: var(--done-x); --xb: var(--done-b); --xt: var(--done-t); }
[data-col="viral"] { --x: var(--viral-x); --xb: var(--viral-b); --xt: var(--viral-t); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.4; padding-inline: 16px; overflow-x: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

#app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 12px 4px; max-width: 1400px; margin-inline: auto; }
.top { display: flex; align-items: center; gap: 10px; flex: none; }
.brand { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -0.02em; white-space: nowrap; }
.search { flex: 1 1 0; min-width: 0; max-width: 320px; margin-left: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.search::placeholder { color: var(--muted); }
.theme-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.theme-btn svg { width: 18px; height: 18px; }

.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; flex: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid transparent; background: var(--xb); color: var(--xt); border-radius: 999px; padding: 6px 12px 6px 10px; font-weight: 600; font-size: 13px; }
.tab i { width: 8px; height: 8px; border-radius: 50%; background: var(--x); }
.tab b { font-weight: 600; font-variant-numeric: tabular-nums; opacity: .8; }
.tab[aria-current="true"] { border-color: var(--x); }

.banner { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 12px; font-size: 13px; flex: none; }
.banner span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.banner button { border: 0; background: var(--surface2); border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: 13px; }
.sample-note { background: var(--ideas-b); color: var(--ideas-t); border-color: transparent; }

.board { position: relative; flex: 1; min-height: 0; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 76px; scrollbar-width: thin; }
.col { flex: 0 0 min(84vw, 300px); display: flex; flex-direction: column; min-height: 0; max-height: 100%; background: var(--xb); border-radius: 14px; scroll-snap-align: start; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 12px 10px 8px 14px; color: var(--xt); }
.col-head i { width: 10px; height: 10px; border-radius: 3px; background: var(--x); }
.col-head h2 { margin: 0; font-family: var(--display); font-size: 16px; letter-spacing: -0.01em; flex: 1; }
.col-head .n { font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.col-add { width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; color: var(--xt); font-size: 20px; line-height: 1; }
.col-add:hover { background: color-mix(in srgb, var(--x) 22%, transparent); }
.col-body { flex: 1; min-height: 80px; overflow-y: auto; padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 8px; border-radius: 0 0 14px 14px; }
.col-body.over { outline: 2px dashed var(--x); outline-offset: -4px; }
.empty { color: var(--xt); opacity: .75; font-size: 13px; padding: 14px 6px; text-align: center; }

.card { flex: none; display: block; width: 100%; text-align: left; background: var(--surface); border: 0; border-radius: 10px; padding: 0; overflow: hidden; border-top: 3px solid var(--x); box-shadow: 0 1px 0 var(--line); }
.card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.card.dragging { opacity: .45; }
.thumb { position: relative; min-height: 80px; background: var(--surface2); overflow: hidden; }
.thumb img, .thumb video { width: 100%; height: auto; max-height: 70vh; object-fit: contain; display: block; margin: 0 auto; }
.thumb .more { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
.thumb .play { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
.card-main { padding: 10px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
.card-title { font-weight: 600; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { border: 0; background: var(--xb); color: var(--xt); border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; }
.tag.more-tag { background: var(--surface2); color: var(--muted); }
.tag:hover { filter: brightness(.96); }
.card-date { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

.fab { position: fixed; right: max(16px, calc((100vw - 1400px) / 2 + 16px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); height: 52px; padding: 0 20px 0 16px; border-radius: 26px; border: 0; background: var(--ink); color: var(--ink-fg); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.28); z-index: 5; }
.fab span { font-size: 22px; line-height: 1; }

.scrim { position: fixed; inset: 0; background: rgba(8,10,16,.55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 520px; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 18px; } }
.sheet-top { display: flex; align-items: center; gap: 10px; }
.sheet-top h3 { margin: 0; font-family: var(--display); font-size: 18px; flex: 1; }
.x-btn { width: 34px; height: 34px; border-radius: 9px; border: 0; background: var(--surface2); font-size: 18px; line-height: 1; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lbl { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; }
textarea.input { min-height: 84px; resize: vertical; }
.status-row { display: flex; flex-wrap: wrap; gap: 6px; }
.status-chip { border: 1.5px solid transparent; background: var(--xb); color: var(--xt); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 13px; }
.status-chip[aria-pressed="true"] { border-color: var(--x); background: var(--x); color: #fff; }
.chip-input { display: flex; flex-wrap: wrap; gap: 6px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px; }
.chip-input input { flex: 1 1 120px; min-width: 0; border: 0; background: transparent; padding: 3px 4px; outline: none; }
.chip-input:focus-within { outline: 2px solid var(--ink); outline-offset: 1px; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--surface2); border-radius: 6px; padding: 2px 4px 2px 8px; font-size: 13px; font-weight: 600; }
.chip button { border: 0; background: transparent; width: 20px; height: 20px; line-height: 1; border-radius: 4px; color: var(--muted); }
.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.m-item { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--surface2); }
.m-item img, .m-item video { width: 100%; height: 100%; object-fit: cover; display: block; }
.m-item button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.7); color: #fff; line-height: 1; }
.add-media { border: 1.5px dashed var(--line); background: transparent; border-radius: 10px; padding: 12px; font-weight: 600; color: var(--muted); }
.stamp { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 8px; }
.btn { flex: 1; border: 0; border-radius: 10px; padding: 12px; font-weight: 600; background: var(--ink); color: var(--ink-fg); }
.btn.ghost { flex: none; background: var(--surface2); color: var(--fg); }
.btn.danger { flex: none; background: transparent; color: var(--danger); border: 1px solid var(--line); }
.card.flash { outline: 3px solid var(--x); outline-offset: 2px; }
.add-media { position: relative; display: block; text-align: center; overflow: hidden; cursor: pointer; }
.file-cover { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
.col.collapsed { flex: 0 0 52px; align-items: center; gap: 10px; padding: 14px 0; border: 0; cursor: pointer; color: var(--xt); background: var(--xb); font-family: var(--display); }
.col.collapsed i { width: 10px; height: 10px; border-radius: 3px; background: var(--x); }
.col.collapsed .sn { font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.col.collapsed .sname { writing-mode: vertical-rl; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
.col.collapsed.over { outline: 2px dashed var(--x); outline-offset: -4px; }
.tab.off { opacity: .55; }
.theme-btn { position: relative; flex: none; }
.theme-btn.nudge::after { content: ""; position: absolute; top: 5px; right: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--viral-x); border: 2px solid var(--surface); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--ink-fg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; z-index: 80; max-width: calc(100vw - 32px); overflow-wrap: anywhere; box-shadow: 0 6px 20px rgba(0,0,0,.28); }
.stack { display: flex; flex-direction: column; gap: 8px; }
.stack .btn { flex: none; }
.hint { font-size: 13px; color: var(--muted); }
.hint.err { color: var(--danger); }
.bk-block { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--bg); border-radius: 12px; }
.bk-block h4 { margin: 0; font-family: var(--display); font-size: 16px; }
.thumb { cursor: zoom-in; }
.m-item { cursor: zoom-in; }
.m-item .play { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
.m-item button.dl { top: auto; bottom: 4px; right: 4px; width: 28px; height: 28px; font-size: 15px; }
.copy-all { width: 100%; }
.vw { position: fixed; inset: 0; z-index: 60; background: #000; display: flex; flex-direction: column; color: #fff; }
.vw-bar { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; flex: none; }
.vw-count { margin-right: auto; font-size: 13px; font-variant-numeric: tabular-nums; opacity: .85; }
.vw-btn { border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 600; background: #fff; color: #111; }
.vw-btn.ghost { background: rgba(255,255,255,.18); color: #fff; }
.vw-stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); }
.vw-media { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.vw-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.22); color: #fff; font-size: 24px; line-height: 1; }
.vw-nav.prev { left: 8px; }
.vw-nav.next { right: 8px; }
.counter { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.counter.warn { color: var(--ideas-t); font-weight: 600; }
.counter.over { color: var(--danger); font-weight: 600; }
.over-flag { font-size: 12px; font-weight: 600; color: var(--danger); }
.perf { font-size: 12px; font-weight: 600; color: var(--xt); background: var(--xb); border-radius: 6px; padding: 3px 8px; overflow-wrap: anywhere; }
.perf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.perf-grid .input { min-width: 0; }
.col-arch { border: 0; background: color-mix(in srgb, var(--x) 22%, transparent); color: var(--xt); border-radius: 8px; padding: 5px 9px; font-weight: 600; font-size: 12px; }
.btn.ghost.half { flex: 1; }
.btn.sm { padding: 8px 12px; font-size: 13px; }
.arch-row { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 10px; padding: 8px 8px 8px 12px; }
.arch-main { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; display: flex; flex-direction: column; gap: 2px; padding: 0; }
.arch-title { font-weight: 600; overflow-wrap: anywhere; }
.card-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.chip-up { font-size: 11px; font-weight: 600; color: var(--xt); background: var(--xb); border-radius: 5px; padding: 1px 6px; font-variant-numeric: tabular-nums; }
.chip-up.today { box-shadow: inset 0 0 0 1.5px var(--x); }
.chip-up.late { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
.card.drop-before { box-shadow: 0 -3px 0 0 var(--x); }
.card.drop-after { box-shadow: 0 3px 0 0 var(--x); }
.date-row { display: flex; gap: 8px; align-items: center; }
.date-row .input { flex: 1; min-width: 0; }
.scrim.top { z-index: 50; }
.tools { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: none; }
.tools::-webkit-scrollbar { display: none; }
.tool { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; font-weight: 600; font-size: 13px; }
.tool b { background: var(--viral-x); color: var(--ink-fg); border-radius: 99px; font-size: 11px; line-height: 1; padding: 3px 7px; font-variant-numeric: tabular-nums; }
.pill { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--xb); color: var(--xt); }
.meta-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.late-h { color: var(--danger); }
.arch-row .btn { flex: none; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--surface); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.stat span { display: block; font-size: 12px; color: var(--muted); }
.stat b { font-size: 16px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.recap-row { display: flex; flex-direction: column; gap: 6px; width: 100%; text-align: left; border: 0; background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.recap-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.recap-top b { font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--viral-x); border-radius: 3px; }
.tpl-row { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 10px; padding: 10px 8px 10px 12px; }
.tpl-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tpl-prev { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; overflow-wrap: anywhere; }
.tpl-btns { display: flex; gap: 6px; flex: none; }
.tpl-btns .btn { flex: none; }
.tool.dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--viral-x); }
.btn[disabled] { opacity: .55; cursor: default; }
.sync-url { display: flex; gap: 8px; align-items: center; }
.sync-url code { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 12.5px; background: var(--surface); border-radius: 8px; padding: 8px 10px; }
@media (prefers-reduced-motion: no-preference) { .col { transition: transform .15s; } .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>

<div id="app">
  <div class="top">
    <div class="brand">Stefs Content</div>
    <input id="q" class="search" type="search" placeholder="Cari judul atau #produk" aria-label="Cari kartu">
    <button id="backupBtn" class="theme-btn" aria-label="Backup dan pulihkan" title="Backup dan pulihkan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
    </button>
    <button id="themeBtn" class="theme-btn" aria-label="Ganti tema" title="Ganti tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Kolom"></nav>
  <div class="tools" id="tools"></div>
  <div id="banners"></div>
  <main class="board" id="board"></main>
</div>
<button class="fab" id="fab"><span>+</span>Kartu baru</button>
<div id="sheetRoot"></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="popRoot"></div>
<div id="viewerRoot"></div>

<script>
(function () {
  var COLS = [
    { id: "inspo", name: "Inspo" }, { id: "ideas", name: "Ideas" }, { id: "ongoing", name: "Ongoing" },
    { id: "schedule", name: "Schedule" }, { id: "done", name: "Done" }, { id: "viral", name: "Viral" }
  ];
  var state = { cards: [], q: "", tag: "", collapsed: {}, tpls: [] };
  var db = null, urlCache = {};

  /* ---------- penyimpanan di perangkat (IndexedDB) ---------- */
  function openDB() {
    return new Promise(function (res) {
      try {
        var r = indexedDB.open("content-planner", 1);
        r.onupgradeneeded = function () { r.result.createObjectStore("cards", { keyPath: "id" }); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
  }
  function dbAll() {
    return new Promise(function (res) {
      if (!db) return res([]);
      try {
        var q = db.transaction("cards").objectStore("cards").getAll();
        q.onsuccess = function () { res((q.result || []).map(function (c) { if (!c.rev) c.rev = c.updated || c.created || 1; return c; })); };
        q.onerror = function () { res([]); };
      } catch (e) { res([]); }
    });
  }
  function dbPutRaw(c) { if (!db) return; try { db.transaction("cards", "readwrite").objectStore("cards").put(c); } catch (e) {} }
  function dbPut(c) { c.rev = Date.now(); dbPutRaw(c); }
  function dbDel(id) { if (!db) return; try { db.transaction("cards", "readwrite").objectStore("cards").delete(id); } catch (e) {} }
  function flag(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; }

  /* ---------- util ---------- */
  function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") el.className = attrs[k];
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k]);
    }
    function add(c) {
      if (c == null || c === false) return;
      if (Array.isArray(c)) { c.forEach(add); return; }
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    for (var i = 2; i < arguments.length; i++) add(arguments[i]);
    return el;
  }
  var fmtSame = new Intl.DateTimeFormat("id-ID", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  var fmtYear = new Intl.DateTimeFormat("id-ID", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  function fmt(ts) {
    var d = new Date(ts);
    return (d.getFullYear() === new Date().getFullYear() ? fmtSame : fmtYear).format(d).replace(/\./g, ".");
  }
  function urlFor(m) { if (!urlCache[m.id]) urlCache[m.id] = URL.createObjectURL(m.blob); return urlCache[m.id]; }
  function normTag(s) { return String(s).toLowerCase().replace(/^#+/, "").replace(/[^a-z0-9_\-]/g, "").slice(0, 30); }
  function colName(id) { return COLS.filter(function (c) { return c.id === id; })[0].name; }

  /* ---------- data contoh ---------- */
  function seed() {
    var now = Date.now(), H = 3600e3, D = 24 * H;
    var s = [
      ["inspo", "Format thread 'mitos vs fakta' yang sering dishare", ["panci", "dapur"], 5 * D],
      ["inspo", "Gaya foto flat lay produk dari akun luar", ["handuk"], 3 * D],
      ["ideas", "Anti lengket tahan berapa lama? Bahas jenis coating", ["panci", "dapur"], 2 * D],
      ["ideas", "Handuk mahal vs murah: bedanya di benang atau tenunan", ["handuk", "rumahtangga"], D],
      ["ongoing", "Perbandingan 3 blender di bawah 500rb", ["blender", "dapur", "elektronik"], 6 * H],
      ["schedule", "Cara baca label GSM kasur lipat", ["kasur", "rumahtangga"], 3 * H],
      ["done", "Thread rice cooker: low carb itu beneran?", ["ricecooker", "dapur"], 4 * D],
      ["viral", "Panci murah vs mahal, apa bedanya?", ["panci", "dapur"], 9 * D]
    ];
    return s.map(function (r, i) {
      return { id: uid(), title: r[1], notes: "", col: r[0], tags: r[2], media: [], created: now - r[3], updated: now - r[3] + i * 60000, sample: true };
    });
  }

  /* ---------- render papan ---------- */
  function visible(c) {
    if (c.archived) return false;
    if (state.tag && c.tags.indexOf(state.tag) < 0) return false;
    var q = state.q.trim().toLowerCase();
    if (!q) return true;
    if (q.charAt(0) === "#") return c.tags.some(function (t) { return t.indexOf(q.slice(1)) >= 0; });
    return c.title.toLowerCase().indexOf(q) >= 0 || c.notes.toLowerCase().indexOf(q) >= 0 ||
      c.tags.some(function (t) { return t.indexOf(q) >= 0; });
  }

  function cardEl(c) {
    var first = c.media[0], thumb = null;
    if (first) {
      var isVid = first.type.indexOf("video") === 0;
      var m = isVid
        ? h("video", { src: urlFor(first), muted: "", playsinline: "", preload: "metadata" })
        : h("img", { src: urlFor(first), alt: "", loading: "lazy" });
      thumb = h("div", { class: "thumb", onclick: function (e) { e.stopPropagation(); openViewer(c.media.slice(), 0); } }, m,
        isVid ? h("span", { class: "play" }, "Video") : null,
        c.media.length > 1 ? h("span", { class: "more" }, "+" + (c.media.length - 1)) : null);
    }
    var shown = c.tags.slice(0, 3);
    var tagEls = shown.map(function (t) {
      return h("span", { class: "tag", role: "button", tabindex: "0", "aria-label": "Tampilkan semua kartu #" + t,
        onclick: function (e) { e.stopPropagation(); setTag(t); },
        onkeydown: function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); setTag(t); } } }, "#" + t);
    });
    if (c.tags.length > 3) tagEls.push(h("span", { class: "tag more-tag" }, "+" + (c.tags.length - 3)));
    var el = h("div", { class: "card", role: "button", tabindex: "0", draggable: "true", "data-col": c.col, "data-id": c.id,
      onclick: function () { openSheet(c.id); },
      onkeydown: function (e) { if (e.key === "Enter") openSheet(c.id); },
      ondragstart: function (e) { el.classList.add("dragging"); try { e.dataTransfer.setData("text/plain", c.id); e.dataTransfer.effectAllowed = "move"; } catch (x) {} },
      ondragend: function () { el.classList.remove("dragging"); clearDrop(); },
      ondragover: function (e) {
        e.preventDefault(); e.stopPropagation();
        var r = el.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
        clearDrop(); el.classList.add(after ? "drop-after" : "drop-before");
      },
      ondragleave: function () { el.classList.remove("drop-before", "drop-after"); },
      ondrop: function (e) {
        e.preventDefault(); e.stopPropagation();
        var r = el.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2, id = "";
        try { id = e.dataTransfer.getData("text/plain"); } catch (x) {}
        clearDrop();
        if (id && id !== c.id) placeCard(id, c.col, c.id, after);
      } },
      thumb,
      h("div", { class: "card-main" },
        h("div", { class: "card-title" }, c.title || "Tanpa judul"),
        tagEls.length ? h("div", { class: "tags" }, tagEls) : null,
        perfLine(c), overFlag(c),
        h("div", { class: "card-meta" }, uploadChip(c), h("span", { class: "card-date" }, "Diubah " + fmt(c.updated)))));
    return el;
  }

  function render() {
    ensureOrder();
    var board = document.getElementById("board"), keep = board.scrollLeft;
    board.textContent = "";
    var tabs = document.getElementById("tabs");
    tabs.textContent = "";
    COLS.forEach(function (col, i) {
      var items = state.cards.filter(function (c) { return c.col === col.id && visible(c); })
        .sort(cmpOrder);
      tabs.appendChild(h("button", { class: "tab" + (state.collapsed[col.id] ? " off" : ""), "data-col": col.id, "data-i": i, onclick: function () { if (state.collapsed[col.id]) toggleCol(col.id); scrollToCol(i); } },
        h("i"), col.name, h("b", null, String(items.length))));
      var body = h("div", { class: "col-body" });
      if (!items.length) body.appendChild(h("div", { class: "empty" }, state.tag || state.q ? "Tidak ada yang cocok" : "Belum ada kartu"));
      items.forEach(function (c) { body.appendChild(cardEl(c)); });
      body.addEventListener("dragover", function (e) { e.preventDefault(); body.classList.add("over"); });
      body.addEventListener("dragleave", function () { body.classList.remove("over"); });
      body.addEventListener("drop", function (e) {
        e.preventDefault(); body.classList.remove("over"); clearDrop();
        var id = ""; try { id = e.dataTransfer.getData("text/plain"); } catch (x) {}
        if (id) placeCard(id, col.id, null, false);
      });
      if (state.collapsed[col.id]) { board.appendChild(stripEl(col, items.length)); return; }
      board.appendChild(h("section", { class: "col", "data-col": col.id },
        h("div", { class: "col-head" }, h("i"), h("h2", null, col.name),
          h("span", { class: "n" }, String(items.length)),
          col.id === "done" ? h("button", { class: "col-arch", type: "button", "aria-label": "Buka arsip", onclick: openArchive }, "Arsip" + (state.cards.some(function (c) { return c.archived; }) ? " " + state.cards.filter(function (c) { return c.archived; }).length : "")) : null,
          h("button", { class: "col-add", "aria-label": "Sembunyikan kolom " + col.name, title: "Sembunyikan", onclick: function () { toggleCol(col.id); } }, "‹"),
          h("button", { class: "col-add", "aria-label": "Tambah kartu di " + col.name, onclick: function () { openSheet(null, col.id); } }, "+")),
        body));
    });
    board.scrollLeft = keep;
    renderBanners();
    renderTools();
    markActiveTab();
  }

  function renderBanners() {
    updateNudge();
    var b = document.getElementById("banners");
    b.textContent = "";
    var wrap = h("div", { style: "display:flex;flex-direction:column;gap:8px" });
    if (state.tag) {
      var n = state.cards.filter(function (c) { return c.tags.indexOf(state.tag) >= 0 && !c.archived; }).length;
      wrap.appendChild(h("div", { class: "banner" }, h("span", null, "Semua kartu #" + state.tag + " (" + n + ")"),
        h("button", { onclick: function () { setTag(""); } }, "Tampilkan semua")));
    }
    if (state.cards.some(function (c) { return c.sample; })) {
      wrap.appendChild(h("div", { class: "banner sample-note" }, h("span", null, "Ini kartu contoh. Hapus kapan saja, atau langsung tambah kartumu."),
        h("button", { onclick: clearSamples }, "Hapus contoh")));
    }
    if (wrap.childNodes.length) b.appendChild(wrap);
  }

  function scrollToCol(i) {
    var board = document.getElementById("board"), col = board.children[i];
    if (col) board.scrollTo({ left: col.offsetLeft - 0, behavior: "smooth" });
  }
  function markActiveTab() {
    var board = document.getElementById("board"), cur = 0, best = 1e9;
    for (var i = 0; i < board.children.length; i++) {
      var d = Math.abs(board.children[i].offsetLeft - board.scrollLeft);
      if (d < best) { best = d; cur = i; }
    }
    var ts = document.querySelectorAll(".tab");
    for (var j = 0; j < ts.length; j++) ts[j].setAttribute("aria-current", j === cur ? "true" : "false");
  }

  function stripEl(col, n) {
    var el = h("button", { class: "col collapsed", type: "button", "data-col": col.id, "aria-label": "Tampilkan kolom " + col.name, title: "Tampilkan", onclick: function () { toggleCol(col.id); } },
      h("i"), h("span", { class: "sn" }, String(n)), h("span", { class: "sname" }, col.name));
    el.addEventListener("dragover", function (e) { e.preventDefault(); el.classList.add("over"); });
    el.addEventListener("dragleave", function () { el.classList.remove("over"); });
    el.addEventListener("drop", function (e) {
      e.preventDefault(); el.classList.remove("over");
      var id = ""; try { id = e.dataTransfer.getData("text/plain"); } catch (x) {}
      moveCard(id, col.id);
    });
    return el;
  }
  function toggleCol(id) {
    state.collapsed[id] = !state.collapsed[id];
    flag("collapsed", JSON.stringify(state.collapsed));
    render();
  }
  function currentColId() {
    var board = document.getElementById("board"), cur = 0, best = 1e9;
    for (var i = 0; i < board.children.length; i++) {
      var d = Math.abs(board.children[i].offsetLeft - board.scrollLeft);
      if (d < best) { best = d; cur = i; }
    }
    return COLS[cur].id;
  }
  function setTag(t) { state.tag = t; render(); }
  function moveCard(id, col) {
    var first = colCards(col).filter(function (x) { return x.id !== id; })[0];
    placeCard(id, col, first ? first.id : null, false);
  }
  function clearSamples() {
    state.cards = state.cards.filter(function (c) { if (c.sample) { dbDel(c.id); return false; } return true; });
    render();
  }

  /* ---------- editor kartu ---------- */
  var draft = null;
  function openSheet(id, presetCol) {
    var existing = id ? state.cards.filter(function (c) { return c.id === id; })[0] : null;
    draft = existing
      ? { id: existing.id, isNew: false, title: existing.title, notes: existing.notes, col: existing.col, tags: existing.tags.slice(), media: existing.media.slice(), perf: normPerf(existing.perf), archived: !!existing.archived, postDate: existing.postDate || "", created: existing.created, updated: existing.updated }
      : { id: uid(), isNew: true, title: "", notes: "", col: presetCol || currentColId(), tags: [], media: [], perf: normPerf(), archived: false, postDate: "", created: Date.now(), updated: Date.now() };
    drawSheet(true);
  }
  function closeSheet() { draft = null; storageOpen = false; tplEdit = null; syncOpen = false; syncEditCid = false; document.getElementById("sheetRoot").textContent = ""; }

  function drawSheet(focus) {
    var root = document.getElementById("sheetRoot"), confirmDel = false;
    root.textContent = "";
    var title = h("input", { class: "input", id: "fTitle", placeholder: "Judul konten", value: draft.title,
      oninput: function () { draft.title = title.value; } });
    var notes = h("textarea", { class: "input", id: "fNotes", placeholder: "Catatan, hook, link referensi",
      oninput: function () { draft.notes = notes.value; updateCounter(); } });
    notes.value = draft.notes;
    var counter = h("div", { class: "counter", id: "fCount", "aria-live": "polite" });
    function updateCounter() {
      var n = Array.from(draft.notes).length, left = 500 - n;
      counter.className = "counter" + (left < 0 ? " over" : left <= 50 ? " warn" : "");
      counter.textContent = left >= 0
        ? n + " / 500 karakter, sisa " + left
        : n + " / 500 karakter, -" + (-left) + " (kurangi " + (-left) + " untuk mencapai 500)";
    }
    updateCounter();

    var statusRow = h("div", { class: "status-row" });
    COLS.forEach(function (c) {
      statusRow.appendChild(h("button", { class: "status-chip", type: "button", "data-col": c.id, "aria-pressed": String(draft.col === c.id),
        onclick: function () { draft.col = c.id; drawSheet(false); } }, c.name));
    });

    var tagBox = h("div", { class: "chip-input", "data-col": draft.col });
    draft.tags.forEach(function (t, i) {
      tagBox.appendChild(h("span", { class: "chip" }, "#" + t,
        h("button", { type: "button", "aria-label": "Hapus #" + t, onclick: function () { draft.tags.splice(i, 1); drawSheet(false); } }, "×")));
    });
    var tagIn = h("input", { id: "fTag", placeholder: draft.tags.length ? "" : "Ketik produk lalu spasi, contoh: panci", "aria-label": "Tambah hashtag produk" });
    function commitTag(redraw) {
      var parts = tagIn.value.split(/[\s,]+/).map(normTag).filter(Boolean), changed = false;
      parts.forEach(function (t) { if (draft.tags.indexOf(t) < 0) { draft.tags.push(t); changed = true; } });
      tagIn.value = "";
      if (changed && redraw) drawSheet(false, true);
    }
    tagIn.addEventListener("keydown", function (e) {
      if (e.key === " " || e.key === "," || e.key === "Enter") { e.preventDefault(); if (tagIn.value.trim()) { commitTag(true); setTimeout(function () { var n = document.getElementById("fTag"); if (n) n.focus(); }, 0); } }
      else if (e.key === "Backspace" && !tagIn.value && draft.tags.length) { draft.tags.pop(); drawSheet(false); setTimeout(function () { var n = document.getElementById("fTag"); if (n) n.focus(); }, 0); }
    });
    tagBox.appendChild(tagIn);

    var grid = h("div", { class: "media-grid" });
    draft.media.forEach(function (m, i) {
      var isVid = m.type.indexOf("video") === 0;
      grid.appendChild(h("div", { class: "m-item", role: "button", tabindex: "0", "aria-label": "Lihat besar", onclick: function () { openViewer(draft.media.slice(), i); } },
        isVid ? h("video", { src: urlFor(m), playsinline: "", preload: "metadata" }) : h("img", { src: urlFor(m), alt: m.name || "" }),
        isVid ? h("span", { class: "play" }, "Video") : null,
        h("button", { type: "button", class: "dl", "aria-label": "Unduh", onclick: function (e) { e.stopPropagation(); downloadMedia(m, i); } }, "↓"),
        h("button", { type: "button", "aria-label": "Hapus media", onclick: function (e) { e.stopPropagation(); draft.media.splice(i, 1); drawSheet(false); } }, "×")));
    });
    var addBtn = h("label", { class: "add-media" }, "+ Tambah foto atau video",
      h("input", { type: "file", class: "file-cover", accept: "image/*,video/*", multiple: "", "aria-label": "Tambah foto atau video", onchange: addFiles }));

    var del = null;
    if (!draft.isNew) {
      del = h("button", { class: "btn danger", type: "button", onclick: function () {
        if (!confirmDel) { confirmDel = true; del.textContent = "Yakin hapus?"; return; }
        addTomb("c_" + draft.id);
        state.cards = state.cards.filter(function (c) { return c.id !== draft.id; }); dbDel(draft.id); closeSheet(); render();
      } }, "Hapus");
    }

    var perfBlock = null;
    if (draft.col === "viral") {
      var perfField = function (label, key) {
        return h("div", { class: "field" }, h("label", { for: "p_" + key }, label),
          h("input", { class: "input", id: "p_" + key, inputmode: "numeric", placeholder: "0", value: draft.perf[key],
            oninput: function (e) { var v = e.target.value.replace(/\D/g, ""); e.target.value = v; draft.perf[key] = v; } }));
      };
      var pNote = h("textarea", { class: "input", id: "pNote", placeholder: "Apa yang bikin ini jalan? Hook, jam tayang, produk, format...",
        oninput: function (e) { draft.perf.note = e.target.value; } });
      pNote.value = draft.perf.note;
      perfBlock = h("div", { class: "bk-block" }, h("h4", null, "Performa"),
        h("div", { class: "perf-grid" }, perfField("Views", "views"), perfField("Likes", "likes"), perfField("Klik link", "clicks"), perfField("Komisi (Rp)", "commission")),
        h("div", { class: "field" }, h("label", { for: "pNote" }, "Catatan hasil"), pNote));
    }
    var dateIn = h("input", { class: "input", id: "fPost", type: "date", value: draft.postDate || "", oninput: function (e) { draft.postDate = e.target.value; } });
    var postField = h("div", { class: "field" }, h("label", { for: "fPost" }, "Tanggal upload"),
      h("div", { class: "date-row" }, dateIn,
        h("button", { class: "btn ghost sm", type: "button", onclick: function () { dateIn.value = ""; draft.postDate = ""; } }, "Kosongkan")));
    var upBtn = h("button", { class: "btn ghost half", type: "button", onclick: function () { nudge(-1); } }, "▲ Naikkan");
    var downBtn = h("button", { class: "btn ghost half", type: "button", onclick: function () { nudge(1); } }, "▼ Turunkan");
    var dupBtn = h("button", { class: "btn ghost half", type: "button", onclick: duplicateDraft }, "Duplikat");
    var archBtn = h("button", { class: "btn ghost half", type: "button", onclick: function () {
      var toArch = !draft.archived;
      draft.archived = toArch;
      save();
      showToast(toArch ? "Dipindah ke arsip" : "Dikeluarkan dari arsip");
    } }, draft.archived ? "Keluarkan dari arsip" : "Arsipkan");
    var sheet = h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": "Detail kartu", "data-col": draft.col },
      h("div", { class: "sheet-top" }, h("h3", null, draft.isNew ? "Kartu baru" : "Detail kartu"),
        h("button", { class: "x-btn", type: "button", "aria-label": "Tutup", onclick: closeSheet }, "×")),
      h("div", { class: "field" }, h("label", { for: "fTitle" }, "Judul"), title),
      h("div", { class: "field" }, h("span", { class: "lbl" }, "Kolom"), statusRow),
      h("div", { class: "field" }, h("label", { for: "fTag" }, "Produk (#)"), tagBox),
      postField,
      h("div", { class: "field" }, h("label", { for: "fNotes" }, "Catatan / caption"), notes, counter),
      h("div", { class: "actions" },
        h("button", { class: "btn ghost half", type: "button", onclick: openPicker }, "Template caption"),
        h("button", { class: "btn ghost half copy-all", type: "button", onclick: copyAll }, "Salin semua teks")),
      perfBlock,
      h("div", { class: "field" }, h("span", { class: "lbl" }, "Foto dan video"), draft.media.length ? grid : null,
        draft.media.length > 1 ? h("button", { class: "btn ghost", type: "button", onclick: function () { downloadAll(draft.media); } }, "Unduh semua (" + draft.media.length + ")") : null,
        addBtn),
      draft.isNew ? null : h("div", { class: "stamp" }, "Terakhir diubah " + fmt(draft.updated)),
      draft.isNew ? null : h("div", { class: "actions" }, dupBtn, archBtn),
      draft.isNew || draft.archived ? null : h("div", { class: "actions" }, upBtn, downBtn),
      h("div", { class: "actions" }, del, h("button", { class: "btn ghost", type: "button", onclick: closeSheet }, "Batal"),
        h("button", { class: "btn", type: "button", onclick: save }, "Simpan")));
    var scrim = h("div", { class: "scrim", onclick: function (e) { if (e.target === scrim) closeSheet(); } }, sheet);
    root.appendChild(scrim);
    if (focus) setTimeout(function () { title.focus(); }, 30);
  }

  function save() {
    var tagIn = document.getElementById("fTag");
    if (tagIn && tagIn.value.trim()) tagIn.value.split(/[\s,]+/).map(normTag).filter(Boolean).forEach(function (t) { if (draft.tags.indexOf(t) < 0) draft.tags.push(t); });
    var now = Date.now();
    var card = { id: draft.id, title: draft.title.trim(), notes: draft.notes, col: draft.col, tags: draft.tags, media: draft.media, perf: normPerf(draft.perf), archived: !!draft.archived, postDate: draft.postDate || "", created: draft.created, updated: now };

  function keepNewest(map, id, v) { if (!map[id] || v.rev > map[id].rev) map[id] = v; }
  function decide(local, remote, tb) {
    /* local: objek lokal atau undefined, remote: {rev, del} atau undefined, tb: waktu hapus lokal */
    if (local) {
      if (!remote) return "push";
      if (remote.del) return remote.rev > local.rev ? "dellocal" : "push";
      if (remote.rev > local.rev) return "pull";
      if (local.rev > remote.rev) return "push";
      return null;
    }
    if (!remote || remote.del) return null;
    if (tb && tb > remote.rev) return "pushtomb";
    return "pull";
  }

  function runSync() {
    var st = { pushed: 0, pulled: 0, removed: 0, media: 0, cleaned: 0, err: 0 };
    var rc = {}, rt = {}, rm = {};

    function pullCard(id) {
      var r = rc[id];
      return gJson(r.fileId).then(function (meta) {
        var have = {};
        state.cards.forEach(function (c) { c.media.forEach(function (m) { have[m.id] = m.blob; }); });
        var got = [];
        return seq(Array.isArray(meta.media) ? meta.media : [], function (m) {
          if (have[m.id]) { got.push({ id: m.id, type: m.type, name: m.name, blob: have[m.id] }); return null; }
          var f = rm[m.id];
          if (!f) throw new Error("media belum ada");
          setProg("Mengunduh " + (m.name || "media") + "...");
          return gBlob(f.fileId, m.type).then(function (b) { got.push({ id: m.id, type: m.type, name: m.name, blob: b }); st.media++; });
        }).then(function () {
          meta.media = got;
          var c = cleanCard(meta); c.rev = r.rev; c.sample = false;
          var i = state.cards.map(function (x) { return x.id; }).indexOf(id);
          if (i >= 0) state.cards[i] = c; else state.cards.push(c);
          dbPutRaw(c);
          var tb = loadTomb(); if (tb["c_" + id]) { delete tb["c_" + id]; saveTomb(tb); }
          st.pulled++;
        });
      });
    }
    function pushCard(c) {
      var r = rc[c.id];
      return seq(c.media, function (m) {
        if (rm[m.id]) return null;
        setProg("Mengunggah " + (m.name || "media") + "...");
        return gPut(null, "m_" + m.id + "__" + String(m.name || "file").slice(0, 80), m.type, m.blob, {}).then(function (f) { rm[m.id] = { fileId: f.id, rev: 0, created: Date.now() }; st.media++; });
      }).then(function () {
        var props = { rev: String(c.rev) };
        if (r) props.del = null;
        return gPut(r ? r.fileId : null, "c_" + c.id + ".json", "application/json", cardJson(c), props);
      }).then(function (f) { rc[c.id] = { fileId: f.id, rev: c.rev, del: false, created: Date.now() }; st.pushed++; });
    }

    return gList().then(function (files) {
      files.forEach(function (f) {
        var n = f.name || "", p = f.appProperties || {}, m;
        var v = { fileId: f.id, rev: Number(p.rev) || 0, del: p.del === "1", created: f.createdTime ? Date.parse(f.createdTime) : 0 };
        if ((m = /^c_(.+)\.json$/.exec(n))) keepNewest(rc, m[1], v);
        else if ((m = /^t_(.+)\.json$/.exec(n))) keepNewest(rt, m[1], v);
        else if ((m = /^m_([a-z0-9]+)__/.exec(n))) rm[m[1]] = v;
      });
      saveTemplates();
      if (Object.keys(rc).some(function (k) { return !rc[k].del; }) && state.cards.some(function (c) { return c.sample; })) {
        state.cards = state.cards.filter(function (c) { if (c.sample) { dbDel(c.id); return false; } return true; });
      }
      var tomb = loadTomb(), lc = {}, ids = {};
      state.cards.forEach(function (c) { if (!c.sample) lc[c.id] = c; });
      Object.keys(lc).forEach(function (k) { ids[k] = 1; });
      Object.keys(rc).forEach(function (k) { ids[k] = 1; });
      Object.keys(tomb).forEach(function (k) { if (k.indexOf("c_") === 0) ids[k.slice(2)] = 1; });
      var jobs = Object.keys(ids).map(function (id) { var a = decide(lc[id], rc[id], tomb["c_" + id]); return a ? { a: a, id: id } : null; }).filter(Boolean);
      return seq(jobs, function (j, i) {
        setProg("Kartu " + (i + 1) + " dari " + jobs.length + "...");
        var p;
        if (j.a === "pull") p = pullCard(j.id);
        else if (j.a === "push") p = pushCard(lc[j.id]);
        else if (j.a === "dellocal") {
          p = Promise.resolve().then(function () {
            state.cards = state.cards.filter(function (c) { return c.id !== j.id; }); dbDel(j.id);
            var tb = loadTomb(); tb["c_" + j.id] = rc[j.id].rev; saveTomb(tb); st.removed++;
          });
        } else {
          var rev = loadTomb()["c_" + j.id];
          p = gPut(rc[j.id].fileId, "c_" + j.id + ".json", "application/json", JSON.stringify({ id: j.id, del: true, rev: rev }), { rev: String(rev), del: "1" })
            .then(function () { rc[j.id] = { fileId: rc[j.id].fileId, rev: rev, del: true }; st.pushed++; });
        }
        return p.catch(function (e) { if (e && e.status === 401) throw e; st.err++; });
      });
    }).then(function () {
      setProg("Menyinkronkan template...");
      var tomb = loadTomb(), lt = {}, ids = {};
      state.tpls.forEach(function (t) { lt[t.id] = t; ids[t.id] = 1; });
      Object.keys(rt).forEach(function (k) { ids[k] = 1; });
      Object.keys(tomb).forEach(function (k) { if (k.indexOf("t_") === 0) ids[k.slice(2)] = 1; });
      var jobs = Object.keys(ids).map(function (id) { var a = decide(lt[id], rt[id], tomb["t_" + id]); return a ? { a: a, id: id } : null; }).filter(Boolean);
      return seq(jobs, function (j) {
        var t = lt[j.id], r = rt[j.id], p;
        if (j.a === "push") {
          var props = { rev: String(t.rev) }; if (r) props.del = null;
          p = gPut(r ? r.fileId : null, "t_" + t.id + ".json", "application/json", JSON.stringify({ id: t.id, name: t.name, text: t.text, updated: t.updated, sample: !!t.sample }), props).then(function () { st.pushed++; });
        } else if (j.a === "pull") {
          p = gJson(r.fileId).then(function (o) {
            var nt = { id: j.id, name: String(o.name || ""), text: String(o.text || ""), updated: Number(o.updated) || Date.now(), sample: !!o.sample };
            nt.hash = nt.name + "\u0001" + nt.text; nt.rev = r.rev;
            var i = state.tpls.map(function (x) { return x.id; }).indexOf(j.id);
            if (i >= 0) state.tpls[i] = nt; else state.tpls.push(nt);
            var tb = loadTomb(); if (tb["t_" + j.id]) { delete tb["t_" + j.id]; saveTomb(tb); }
            st.pulled++;
          });
        } else if (j.a === "dellocal") {
          p = Promise.resolve().then(function () {
            state.tpls = state.tpls.filter(function (x) { return x.id !== j.id; });
            var tb = loadTomb(); tb["t_" + j.id] = r.rev; saveTomb(tb); st.removed++;
          });
        } else {
          var rev = tomb["t_" + j.id];
          p = gPut(r.fileId, "t_" + j.id + ".json", "application/json", JSON.stringify({ id: j.id, del: true, rev: rev }), { rev: String(rev), del: "1" }).then(function () { st.pushed++; });
        }
        return p.catch(function (e) { if (e && e.status === 401) throw e; st.err++; });
      }).then(persistTpls);
    }).then(function () {
      if (st.err) return null;
      var ref = {};
      state.cards.forEach(function (c) { c.media.forEach(function (m) { ref[m.id] = 1; }); });
      var orphans = Object.keys(rm).filter(function (id) { return !ref[id] && rm[id].created && Date.now() - rm[id].created > 864e5; }).slice(0, 50);
      return seq(orphans, function (id) { return gDelete(rm[id].fileId).then(function () { st.cleaned++; }).catch(function () {}); });
    }).then(function () { return st; });
  }

  function friendly(e) {
    var m = (e && e.message) || "";
    if (m === "noclient") return "Client ID belum diisi.";
    if (m === "gsi") return "Layanan Google belum siap. Pastikan ada internet, lalu tap Sinkron lagi.";
    if (m === "popup_closed") return "Jendela Google ditutup sebelum selesai. Kalau Google menampilkan error origin_mismatch, cek isian Authorized JavaScript origins di Google Cloud.";
    if (m === "popup_failed_to_open") return "Jendela Google tidak bisa dibuka. Coba buka situs ini langsung di Chrome, lalu sinkron dari sana.";
    if (m === "access_denied") return "Akses ditolak. Pastikan emailmu sudah ditambahkan sebagai Test user dan izin Drive dicentang.";
    if (m === "scope") return "Izin Drive belum diberikan. Ulangi dan centang izin penyimpanan.";
    if (e && e.status === 401) return "Sesi Google habis. Tap Sinkron lagi.";
    if (e && e.status === 403) return /quota/i.test(e.body || "") ? "Ruang Google Drive penuh." : "Drive menolak akses (403). Pastikan Google Drive API sudah diaktifkan di proyekmu.";
    if (e instanceof TypeError) return "Koneksi bermasalah. Coba lagi saat internet stabil.";
    return "Sinkron gagal (" + m + "). Coba lagi.";
  }
  function setProg(t) { syncMsg = t; var el = document.getElementById("syncProg"); if (el) el.textContent = t; }
  function refreshSyncBtn() {
    var b = document.getElementById("syncBtn");
    if (b) { b.disabled = GD.busy; b.textContent = GD.busy ? "Menyinkronkan..." : "Sinkron sekarang"; }
  }
  function startSync() {
    if (GD.busy) return;
    if (!navigator.onLine) { showToast("Tidak ada internet"); return; }
    var t0 = Date.now();
    syncErr = ""; GD.busy = true; setProg("Menghubungkan ke Google..."); refreshSyncBtn();
    ensureToken().then(function () { setProg("Membaca Google Drive..."); return runSync(); })
      .then(function (st) {
        if (!st.err) flag("lastSync", String(t0));
        var parts = [];
        if (st.pushed) parts.push(st.pushed + " dikirim");
        if (st.pulled) parts.push(st.pulled + " diterima");
        if (st.removed) parts.push(st.removed + " dihapus");
        if (st.media) parts.push(st.media + " foto/video");
        if (st.cleaned) parts.push(st.cleaned + " file lama dibersihkan");
        syncMsg = st.err ? "Sinkron belum tuntas. " + (parts.length ? parts.join(", ") + "." : "") : "Sinkron selesai, " + fmt(Date.now()) + ". " + (parts.length ? parts.join(", ") + "." : "Semua sudah sama.");
        if (st.err) syncErr = st.err + " item gagal. Tap Sinkron lagi untuk mencoba ulang.";
      })
      .catch(function (e) { syncErr = friendly(e); syncMsg = ""; })
      .then(function () { GD.busy = false; render(); if (syncOpen) drawSync(); });
  }
  function openSync() { draft = null; storageOpen = false; syncOpen = true; syncEditCid = false; loadGsi().catch(function () {}); drawSync(); }
  function drawSync() {
    var cid = flag("gClientId") || "", blocks = [];
    if (!cid || syncEditCid) {
      var inp = h("input", { class: "input", id: "gCid", placeholder: "123456-abc.apps.googleusercontent.com", value: cid, autocapitalize: "off", autocomplete: "off", spellcheck: "false" });
      blocks.push(h("div", { class: "bk-block" }, h("h4", null, "Sambungkan Google Drive"),
        h("div", { class: "hint" }, "Tempel Client ID dari Google Cloud. Langkah membuatnya ada di panduan. Client ID bukan password, jadi aman disimpan di sini."),
        h("div", { class: "field" }, h("label", { for: "gCid" }, "Client ID"), inp),
        h("div", { class: "actions" },
          cid ? h("button", { class: "btn ghost", type: "button", onclick: function () { syncEditCid = false; drawSync(); } }, "Batal") : null,
          h("button", { class: "btn", type: "button", onclick: function () {
            var v = inp.value.trim();
            if (!/^[A-Za-z0-9_\-.]+\.apps\.googleusercontent\.com$/.test(v)) { showToast("Format Client ID belum benar"); return; }
            flag("gClientId", v); GD.token = ""; GD.tc = null; syncEditCid = false; syncErr = ""; syncMsg = "";
            drawSync(); render();
          } }, "Simpan"))));
      blocks.push(h("div", { class: "bk-block" }, h("h4", null, "Alamat situs ini"),
        h("div", { class: "hint" }, "Isi persis alamat ini di bagian Authorized JavaScript origins saat membuat Client ID."),
        h("div", { class: "sync-url" }, h("code", null, location.origin),
          h("button", { class: "btn ghost sm", type: "button", onclick: function () { copyText(location.origin).then(function () { showToast("Alamat disalin"); }).catch(function () { showToast("Gagal menyalin"); }); } }, "Salin"))));
    } else {
      var last = Number(flag("lastSync") || 0), sure = false;
      var disc = h("button", { class: "btn danger half", type: "button", onclick: function () {
        if (!sure) { sure = true; disc.textContent = "Yakin putuskan?"; return; }
        ["gClientId", "lastSync"].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
        GD.token = ""; GD.tc = null; syncMsg = ""; syncErr = "";
        showToast("Sinkron diputuskan. Data di HP tetap ada."); drawSync(); render();
      } }, "Putuskan");
      blocks.push(h("div", { class: "bk-block" }, h("h4", null, "Sinkron Google Drive"),
        h("div", { class: "hint" }, last ? "Terakhir sinkron: " + fmt(last) + "." : "Belum pernah sinkron."),
        needsSync() ? h("div", { class: "hint" }, "Ada perubahan yang belum dikirim.") : null,
        h("div", { class: "hint", id: "syncProg", "aria-live": "polite" }, syncMsg),
        syncErr ? h("div", { class: "hint err" }, syncErr) : null,
        h("button", { class: "btn", id: "syncBtn", type: "button", disabled: GD.busy ? "true" : null, onclick: startSync }, GD.busy ? "Menyinkronkan..." : "Sinkron sekarang"),
        h("div", { class: "actions" },
          h("button", { class: "btn ghost half", type: "button", onclick: function () { syncEditCid = true; drawSync(); } }, "Ubah Client ID"), disc)));
      blocks.push(h("div", { class: "bk-block" }, h("h4", null, "Cara pakai"),
        h("div", { class: "hint" }, "Di perangkat lain, buka alamat aplikasi ini, isi Client ID yang sama, lalu tap Sinkron sekarang. Kartu, foto, video, dan template akan ikut."),
        h("div", { class: "hint" }, "Kalau dua perangkat mengubah kartu yang sama, versi yang terakhir diubah yang dipakai. Foto dan video ikut dikirim, jadi pakai Wi-Fi untuk sinkron pertama."),
        h("div", { class: "hint" }, "Data tersimpan di folder tersembunyi milik aplikasi di Google Drive-mu dan ikut memakai kuota Drive.")));
    }
    shell("Sinkron Google Drive", blocks, "Sinkron Google Drive", sheetRoot(), closeSheet, false);
  }

  /* ---------- performa, duplikat, arsip ---------- */
  function normPerf(p) { return Object.assign({ views: "", likes: "", clicks: "", commission: "", note: "" }, p || {}); }
  function cleanPerf(p) {
    p = normPerf(p);
    ["views", "likes", "clicks", "commission"].forEach(function (k) { p[k] = String(p[k]).replace(/\D/g, ""); });
    p.note = String(p.note || "");
    return p;
  }
  function perfLine(c) {
    if (c.col !== "viral" || !c.perf) return null;
    var p = c.perf, parts = [], nf = new Intl.NumberFormat("id-ID", { notation: "compact", maximumFractionDigits: 1 });
    if (p.views) parts.push(nf.format(Number(p.views)) + " views");
    if (p.likes) parts.push(nf.format(Number(p.likes)) + " likes");
    if (p.clicks) parts.push(nf.format(Number(p.clicks)) + " klik");
    if (p.commission) parts.push("Rp " + new Intl.NumberFormat("id-ID").format(Number(p.commission)));
    return parts.length ? h("div", { class: "perf" }, parts.join(" · ")) : null;
  }
  function overFlag(c) {
    if (c.col === "done" || c.col === "viral" || c.archived) return null;
    var n = Array.from(c.notes || "").length;
    return n > 500 ? h("div", { class: "over-flag" }, "Caption lebih " + (n - 500) + " karakter") : null;
  }
  function revealCard(card) {
    scrollToCol(COLS.map(function (c) { return c.id; }).indexOf(card.col));
    setTimeout(function () {
      var el = document.querySelector('.card[data-id="' + card.id + '"]');
      if (!el) return;
      el.classList.add("flash");
      el.scrollIntoView({ block: "nearest", inline: "nearest" });
      setTimeout(function () { el.classList.remove("flash"); }, 1800);
    }, 250);
  }
  function duplicateDraft() {
    var now = Date.now();
    var copy = {
      id: uid(), title: (draft.title.trim() || "Tanpa judul") + " (salinan)", notes: draft.notes, col: draft.col,
      tags: draft.tags.slice(),
      media: draft.media.map(function (m) { return { id: uid(), type: m.type, name: m.name, blob: m.blob }; }),
      perf: normPerf(), archived: false, postDate: "", order: orderAfter(draft.id, draft.col), created: now, updated: now
    };
    state.cards.push(copy);
    dbPut(copy);
    state.collapsed[copy.col] = false;
    closeSheet();
    render();
    revealCard(copy);
    showToast("Kartu diduplikat di kolom " + colName(copy.col));
  }
  var archDays = 14;
  function archivedCards() { return state.cards.filter(function (c) { return c.archived; }).sort(function (a, b) { return b.updated - a.updated; }); }
  function oldDone(days) {
    var lim = Date.now() - days * 864e5;
    return state.cards.filter(function (c) { return c.col === "done" && !c.archived && c.updated < lim; });
  }
  function openArchive() { draft = null; drawArchive(); }
  function drawArchive() {
    var root = document.getElementById("sheetRoot");
    root.textContent = "";
    var cand = oldDone(archDays), list = archivedCards();
    var dayRow = h("div", { class: "status-row" });
    [7, 14, 30].forEach(function (d) {
      dayRow.appendChild(h("button", { class: "status-chip", type: "button", "data-col": "done", "aria-pressed": String(archDays === d),
        onclick: function () { archDays = d; drawArchive(); } }, d + " hari"));
    });
    var block1 = h("div", { class: "bk-block" },
      h("h4", null, "Arsipkan Done yang lama"),
      h("div", { class: "hint" }, "Kartu di kolom Done yang tidak diubah lebih dari:"),
      dayRow,
      h("div", { class: "hint" }, cand.length ? cand.length + " kartu akan diarsipkan. Kartu tetap tersimpan dan bisa dikembalikan." : "Tidak ada kartu Done yang selama itu."),
      h("button", { class: "btn", type: "button", disabled: cand.length ? null : "true", onclick: function () {
        var n = cand.length;
        cand.forEach(function (c) { c.archived = true; dbPut(c); });
        render(); showToast(n + " kartu diarsipkan"); drawArchive();
      } }, cand.length ? "Arsipkan " + cand.length + " kartu" : "Arsipkan"));
    var block2 = h("div", { class: "bk-block" }, h("h4", null, "Isi arsip (" + list.length + ")"));
    if (!list.length) block2.appendChild(h("div", { class: "hint" }, "Belum ada kartu di arsip. Kartu yang diarsipkan hilang dari papan tapi tidak terhapus."));
    list.forEach(function (c) {
      block2.appendChild(h("div", { class: "arch-row" },
        h("button", { class: "arch-main", type: "button", onclick: function () { openSheet(c.id); } },
          h("span", { class: "arch-title" }, c.title || "Tanpa judul"),
          h("span", { class: "hint" }, colName(c.col) + ", diubah " + fmt(c.updated))),
        h("button", { class: "btn ghost sm", type: "button", onclick: function () {
          c.archived = false; c.updated = Date.now(); dbPut(c); render();
          showToast("Dikembalikan ke " + colName(c.col)); drawArchive();
        } }, "Kembalikan")));
    });
    var sheet = h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": "Arsip" },
      h("div", { class: "sheet-top" }, h("h3", null, "Arsip"),
        h("button", { class: "x-btn", type: "button", "aria-label": "Tutup", onclick: closeSheet }, "×")),
      block1, block2);
    var scrim = h("div", { class: "scrim", onclick: function (e) { if (e.target === scrim) closeSheet(); } }, sheet);
    root.appendChild(scrim);
  }

  function mediaType(f) {
    if (f.type) return f.type;
    return /\.(mp4|mov|m4v|webm|3gp|mkv)$/i.test(f.name || "") ? "video/mp4" : "image/jpeg";
  }
  function addFiles(e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    if (!draft || !files.length) return;
    files.forEach(function (f) { draft.media.push({ id: uid(), type: mediaType(f), name: f.name, blob: f }); });
    drawSheet(false);
  }

  /* ---------- kontrol atas ---------- */
  document.getElementById("fab").addEventListener("click", function () { openSheet(null); });
  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  document.getElementById("board").addEventListener("scroll", markActiveTab, { passive: true });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (vwOpen) closeViewer();
    else if (document.getElementById("popRoot").firstChild) closePop();
    else if (document.getElementById("sheetRoot").firstChild) closeSheet();
  });
  window.addEventListener("popstate", function () { if (vwOpen) hideViewer(); });
  document.getElementById("backupBtn").addEventListener("click", openBackup);
  document.getElementById("themeBtn").addEventListener("click", function () {
    var root = document.documentElement, cur = root.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });

  /* ---------- mulai ---------- */
  try { state.collapsed = JSON.parse(flag("collapsed") || "{}") || {}; } catch (e) { state.collapsed = {}; }
  loadTemplates();
  render();
  openDB().then(function (d) {
    db = d;
    return dbAll();
  }).then(function (rows) {
    if (rows.length) {
      var have = state.cards.map(function (c) { return c.id; });
      state.cards = rows.filter(function (r) { return have.indexOf(r.id) < 0; }).concat(state.cards);
    }
    else if (!flag("seeded")) { state.cards = seed(); state.cards.forEach(dbPut); flag("seeded", "1"); }
    render();
  });
})();
</script>

if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
